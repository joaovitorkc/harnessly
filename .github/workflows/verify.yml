name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Use the declared Node.js version
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version-file: .node-version

      - name: Select the declared pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Restore maintainer dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify contracts, fixtures, adapters, and release bundle
        run: pnpm verify

      - name: Prove publishable provenance from this clean revision
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: pnpm release:check
