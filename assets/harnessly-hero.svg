<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title description">
  <title id="title">Harnessly</title>
  <desc id="description">Vibe coding toolkit. Map first, change with confidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="0.55" stop-color="#0a0f17"/>
      <stop offset="1" stop-color="#111020"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd52a"/>
      <stop offset="0.5" stop-color="#ff7a24"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d7ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="500" rx="28" fill="url(#background)"/>
  <rect width="1280" height="500" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="498" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <g opacity="0.24" fill="none" stroke="url(#signal)" stroke-width="2">
    <path d="M38 96H182L222 56H350"/>
    <path d="M30 402H176L226 452H430"/>
    <path d="M844 70H1050L1090 110H1244"/>
    <path d="M904 426H1088L1128 386H1248"/>
  </g>

  <g transform="translate(76 118)">
    <g opacity="0.24" fill="none" stroke="url(#signal)" stroke-width="5">
      <path d="M20 20V230M236 20V230M20 72H236M20 178H236"/>
    </g>
    <g fill="none" stroke="url(#signal)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M52 26V224"/>
      <path d="M204 26V224"/>
      <path d="M52 125H204"/>
    </g>
    <g fill="#0b1018" stroke-width="7">
      <circle cx="52" cy="26" r="12" stroke="#ffd52a"/>
      <circle cx="52" cy="125" r="12" stroke="#ff9a25"/>
      <circle cx="52" cy="224" r="12" stroke="#ff7627"/>
      <circle cx="204" cy="26" r="12" stroke="#ffb128"/>
      <circle cx="204" cy="125" r="12" stroke="#e4724d"/>
      <circle cx="204" cy="224" r="12" stroke="#8b5cf6"/>
    </g>
  </g>

  <text x="382" y="118" fill="#ffb52a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="5">VIBE CODING TOOLKIT</text>
  <text x="376" y="228" fill="url(#wordmark)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-4">Harnessly</text>
  <text x="383" y="282" fill="#a8afbd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500">Map first. Change with confidence.</text>

  <g transform="translate(382 338)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
    <g>
      <rect width="184" height="46" rx="23" fill="#ffd52a" fill-opacity="0.1" stroke="#ffd52a" stroke-opacity="0.5"/>
      <circle cx="23" cy="23" r="5" fill="#ffd52a"/>
      <text x="39" y="29" fill="#f8d85d">READ-ONLY FIRST</text>
    </g>
    <g transform="translate(200)">
      <rect width="216" height="46" rx="23" fill="#ff7a24" fill-opacity="0.1" stroke="#ff7a24" stroke-opacity="0.5"/>
      <circle cx="23" cy="23" r="5" fill="#ff7a24"/>
      <text x="39" y="29" fill="#ffad72">WORKS WITH YOUR AI</text>
    </g>
    <g transform="translate(432)">
      <rect width="160" height="46" rx="23" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.55"/>
      <circle cx="23" cy="23" r="5" fill="#a78bfa"/>
      <text x="39" y="29" fill="#c4b5fd">NO RUNTIME</text>
    </g>
  </g>

  <g transform="translate(1024 338)" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M0 22H54L76 0H142"/>
    <path d="M0 46H76L98 68H176"/>
    <circle cx="0" cy="22" r="6" fill="#0b1018"/>
    <circle cx="0" cy="46" r="6" fill="#0b1018"/>
    <circle cx="142" cy="0" r="6" fill="#0b1018"/>
    <circle cx="176" cy="68" r="6" fill="#0b1018"/>
  </g>
</svg>
