schemaVersion: harnessly.dev/scenarios/v1
workflow: build-local-harness
cases:
  - id: static-safe-harness
    fixture: static-landing
    mode: APPLY
    parameters:
      DATA_MODE: READ_ONLY
      ALLOW_CONTAINERS: false
      ALLOW_INSTALL: false
