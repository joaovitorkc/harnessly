schemaVersion: harnessly.dev/profile/v1
name: ADVANCED
version: 0.2.0
description: Create a non-destructive central Orchestrator that routes user problems to the correct registered project, its instructions, harness, and sensor.
topologies:
  - EMBEDDED
  - PARENT_HUB
controlPlane: orchestrator
invariants:
  - Never copy, move, rename, vendor, or nest product repositories.
  - Every registered project path is relative and resolves to a declared Git root.
  - Every project path resolves inside projects.yaml authorizedRoot after symlink resolution.
  - EMBEDDED registers the current repository as ..
  - PARENT_HUB registers selected sibling repositories from their common parent.
  - The control plane does not become a source-code build root.
  - A request is routed to exactly one project before project instructions are loaded.
  - Product work uses the selected project's own entrypoint, harness, and sensor.
  - Git initialization and remote changes are outside setup.
artifacts:
  - path: orchestrator/AGENTS.md
    when: The control-plane path does not collide with unmanaged content.
    ownership: create-only
    existingOwnership: [managed-block, owned-file]
  - path: orchestrator/CLAUDE.md
    when: Claude Code is selected.
    ownership: create-only
    existingOwnership: [owned-file]
  - path: orchestrator/DESIGN.md
    when: Topology and ownership boundaries have been confirmed.
    ownership: create-only
    existingOwnership: [owned-file]
  - path: orchestrator/HARNESS.md
    when: Per-project sensors can be referenced truthfully.
    ownership: create-only
    existingOwnership: [owned-file]
  - path: orchestrator/projects.yaml
    when: Every selected repository root is reachable by a stable relative path.
    ownership: structural-merge
  - path: orchestrator/docs/routing/
    when: Registered projects need a human-readable problem-to-project routing map.
    ownership: owned-file
  - path: orchestrator/docs/inventory/
    when: COMPLETE setup persists workspace units, commands, and routing evidence.
    ownership: owned-file
  - path: orchestrator/docs/harness/
    when: COMPLETE setup records cross-project readiness and verification evidence.
    ownership: owned-file
  - path: orchestrator/docs/tasks/
    when: Cross-project work spans independently verifiable project steps.
    ownership: owned-file
  - path: orchestrator/docs/decisions/
    when: A decision affects more than one registered project.
    ownership: owned-file
  - path: orchestrator/docs/policies/
    when: Shared safety or routing policy applies to the whole workspace.
    ownership: owned-file
  - path: orchestrator/.agents/skills/
    when: Cross-project workflows are detected.
    ownership: create-only
